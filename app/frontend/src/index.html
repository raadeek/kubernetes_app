<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Manager</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar">
        <div>
          <p class="eyebrow">Kubernetes Task Manager</p>
          <h1>Zadania</h1>
        </div>
        <div id="health" class="health">Sprawdzanie API...</div>
      </section>

      <form id="task-form" class="task-form">
        <input id="title" name="title" type="text" placeholder="Nowe zadanie" required>
        <select id="priority" name="priority" aria-label="Priorytet">
          <option value="low">Niski</option>
          <option value="medium" selected>Sredni</option>
          <option value="high">Wysoki</option>
        </select>
        <button type="submit">Dodaj</button>
      </form>

      <section>
        <div id="status" class="status"></div>
        <ul id="tasks" class="tasks"></ul>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
